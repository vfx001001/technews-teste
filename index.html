<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNews - Tecnologia em dia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TechNews</h1>
        <input type="text" id="busca" placeholder="Buscar notícias..." aria-label="Buscar notícias">
        <nav aria-label="Menu principal">
            <a href="#" data-categoria="todos" class="ativo">Início</a>
            <a href="#" data-categoria="ia">IA</a>
            <a href="#" data-categoria="gadgets">Gadgets</a>
            <a href="#" data-categoria="software">Software</a>
            <a href="#" data-categoria="mercado">Mercado</a>
        </nav>
        <button id="toggle-tema" aria-label="Alternar tema claro/escuro">🌙</button>
    </header>

    <main id="lista-noticias" aria-live="polite">
    </main>

    <section class="newsletter">
        <h3>Receba as atualizações por e-mail</h3>
        <p>Inscreva-se para saber quando sair uma notícia nova.</p>
        <form action="https://formspree.io/f/mbgroerv" method="POST">
            <input type="email" name="email" placeholder="seu@email.com" required>
            <button type="submit">Inscrever-se</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 TechNews</p>
        <p><img src="https://hits.sh/vfx001001.github.io/technews-teste.svg" alt="Contador de visitas do site"></p>
    </footer>

    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
